<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDID | AI Duplicate Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>🖼️ NDID System</h1>
            <p>Near-Duplicate Image Detection powered by ResNet50</p>
        </header>

        <div class="tabs">
            <button class="mode-tab active" id="tab-scenario1" onclick="switchMode('scenario1')">Single Check</button>
            <button class="mode-tab" id="tab-scenario2" onclick="switchMode('scenario2')">Bulk Upload</button>
        </div>

        <div class="control-panel">
            <div class="slider-header">
                <label>Similarity Threshold: <span id="threshold-value">0.3442</span></label>
            </div>
            <input type="range" id="threshold" min="0" max="1" step="0.0001" value="0.3442">
            <select id="metric">
                <option value="cosine">Metric: Cosine Similarity</option>
                <option value="euclidean">Metric: Euclidean Distance</option>
            </select>
        </div>

        <div id="scenario1-content" class="scenario-content active">
            <div class="upload-zone" id="zone-single">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
                <p>Drag & Drop or Click to Upload Image</p>
                <input type="file" id="image-single" hidden accept="image/*">
            </div>
            <div id="preview-single" class="preview-box" style="display:none;"></div>
            <button id="remove-single" class="btn-secondary" style="display:none;" onclick="resetSingle()">Remove
                Image</button>
            <button id="checkDuplicateBtn" class="btn-primary" disabled onclick="checkDuplicate()">Run AI
                Analysis</button>

            <div id="results-scenario1" class="results-area" style="display:none;">
                <div id="badge-icon-s1"></div>
                <h2 id="status-text-s1"></h2>
            </div>
        </div>

        <div id="scenario2-content" class="scenario-content" style="display:none;">
            <div class="upload-zone" id="zone-bulk">
                <i class="fas fa-images fa-3x"></i>
                <p>Click to Upload Multiple Images</p>
                <input type="file" id="images-bulk" hidden multiple accept="image/*">
            </div>
            <p id="upload-count">0 images selected</p>
            <div id="bulk-preview-grid" class="bulk-grid"></div>
            <button id="findDuplicatesBtn" class="btn-primary" disabled onclick="findBulkDuplicates()">Find
                Duplicates</button>

            <div id="results-scenario2" class="results-area" style="display:none;">
                <h3>Results Summary</h3>
                <p>Total: <span id="stat-total">0</span> | Groups: <span id="stat-groups">0</span> | Unique: <span
                        id="stat-unique">0</span></p>
                <div id="duplicate-groups"></div>
            </div>
        </div>

        <div id="loading" class="loading-overlay" style="display:none;">
            <i class="fas fa-spinner fa-spin fa-3x"></i>
            <p>AI analyzing vectors...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
