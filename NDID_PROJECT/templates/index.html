<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NDID | AI Duplicate Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>NDID System</h1>
        <p class="subtitle">Upload images to find near-duplicates using AI</p>

        <div class="control-group">
            <label>Similarity Threshold: <b id="threshold-val">0.4126</b></label>
            <input type="range" id="threshold" min="0" max="1" step="0.0001" value="0.4126">
        </div>

        <label for="file-input" class="upload-label">
            <i class="fas fa-cloud-upload-alt"></i>
            <span>Click to select multiple images</span>
            <input type="file" id="file-input" multiple accept="image/*" style="display:none">
        </label>

        <div id="preview-grid" class="preview-grid"></div>

        <button id="analyze-btn" class="analyze-btn" disabled onclick="runAnalysis()">
            Run AI Analysis
        </button>

        <div id="results" class="results-area"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
